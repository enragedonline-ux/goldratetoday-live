<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-label="Buying gold at a 14-month low in India — five checks before you pay: hallmark 916, bill break-up, making charge and 3% GST, MCX vs retail price, and weight">
  <rect width="800" height="480" fill="#0f2040"/>
  <rect width="800" height="6" fill="#d4af37"/>
  <text x="40" y="54" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#ffffff">Buying Gold at a 14-Month Low</text>
  <text x="40" y="84" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#d4af37">18 November 2026 · Five checks before you pay</text>
  <rect x="40" y="120" width="224" height="220" rx="8" fill="#16294d" stroke="#d4af37" stroke-width="1"/>
  <text x="152" y="160" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#d4af37">916</text>
  <text x="152" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Hallmark first</text>
  <text x="152" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1">BIS logo · 916 mark</text>
  <text x="152" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1">Jeweller's mark</text>
  <text x="152" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1">Six-digit code</text>
  <rect x="288" y="120" width="224" height="220" rx="8" fill="#16294d" stroke="#d4af37" stroke-width="1"/>
  <text x="400" y="160" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#d4af37">3% GST</text>
  <text x="400" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Bill break-up</text>
  <text x="400" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1">Metal cost + making</text>
  <text x="400" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1">charge + GST as</text>
  <text x="400" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1">separate lines</text>
  <rect x="536" y="120" width="224" height="220" rx="8" fill="#16294d" stroke="#d4af37" stroke-width="1"/>
  <text x="648" y="160" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#d4af37">Weigh it</text>
  <text x="648" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Weight on the scale</text>
  <text x="648" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1">Scale in front of you</text>
  <text x="648" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1">Bill weight must</text>
  <text x="648" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbd5e1">match the scale</text>
  <rect x="40" y="370" width="720" height="70" rx="6" fill="#16294d" stroke="#d4af37" stroke-width="1"/>
  <text x="400" y="398" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff">MCX is not your bill — compare shop totals, not the futures price</text>
  <text x="400" y="424" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#cbd5e1">Buy the plan, not the bottom — check the rate on the morning you buy</text>
</svg>
